name: Validate office plugin marketplace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate-candidates.py --catalog-only
      - run: python scripts/validate-candidates.py --catalog-only --remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/checkout-release-plugins.mjs --all
      - run: node scripts/sync-codex-bundles.mjs
      - run: node scripts/build-local-marketplace.mjs
      - run: node scripts/sync-marketplaces.mjs --remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/validate-dsh-index.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/sync-cn-marketplace.mjs
      - run: node scripts/sync-cn-marketplace.mjs --channel=atomgit
      - run: node scripts/verify-channel-parity.mjs
      - run: node --test scripts/tests/marketplace.test.mjs
